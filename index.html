<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pip &amp; Grumply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap">
  <script type="module" crossorigin src="./assets/index-BBATJmUd.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DA9-TPCD.css">
</head>
<body>
<div id="app">
  <div id="stage"></div>

  <div id="mood" class="mood" role="img" aria-label="Grumply feels grumpy" hidden></div>

  <div id="hud">
    <button id="replay" class="hud-btn" type="button" aria-label="Hear Pip's intro again" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    </button>
    <button id="mute" class="hud-btn" type="button" aria-label="Mute sound" aria-pressed="false">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/></svg>
    </button>
  </div>

  <div id="subs" class="subs" aria-live="polite"><span class="who">Pip</span><span class="line"></span></div>

  <div id="command" class="cmd" hidden>
    <div id="ctxChips" class="ctx" hidden></div>
    <form id="cmdForm" class="cmd-row" autocomplete="off">
      <label class="field">
        <span class="sr">Tell Pip what to do</span>
        <input id="cmdInput" type="text" maxlength="60" placeholder="Tell Pip what to do…" spellcheck="false" autocapitalize="off" enterkeyhint="go">
        <button id="cmdClear" class="clear" type="button" aria-label="Clear" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg>
        </button>
      </label>
      <button id="doit" class="doit" type="submit"><span>DO IT!</span></button>
    </form>
    <div id="chips" class="chips" role="group" aria-label="Word helpers"></div>
  </div>

  <div id="win" class="win" role="dialog" aria-modal="true" aria-labelledby="winTitle" hidden>
    <div class="win-card">
      <div class="sticker" aria-hidden="true">
        <svg viewBox="0 0 120 120"><path d="M60 6l15.6 33.4 36.6 4.5-27 25.2 7 36.2L60 87.6 27.8 105.3l7-36.2-27-25.2 36.6-4.5z"/></svg>
        <img src="./assets/img/grumply_eyes_1.webp" alt="">
      </div>
      <h2 id="winTitle">Grumply is happy!</h2>
      <p>You found a way to warm him up. You earned a star!</p>
      <div class="win-actions">
        <button id="keepPlaying" class="btn btn-soft" type="button">KEEP PLAYING</button>
        <button id="nextScene" class="btn btn-main" type="button">NEXT SCENE</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <div id="title" class="title">
    <div class="title-inner">
      <h1 class="logo" aria-label="Pip and Grumply"><span class="w-pip">Pip</span><span class="w-amp">&amp;</span><span class="w-grumply">Grumply</span></h1>
      <button id="play" class="play" type="button" disabled>
        <span class="play-label">Loading</span>
        <span class="play-bar" aria-hidden="true"><i></i></span>
      </button>
    </div>
  </div>
</div>
</body>
</html>
